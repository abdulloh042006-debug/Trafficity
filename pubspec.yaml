name: trafficity
description: Uzbekistan-wide 2D/3D traffic and railway engineering simulation game.
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.22.0
  flame_audio: ^2.10.6
  shared_preferences: ^2.3.3
  crypto: ^3.0.6
  archive: ^3.6.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/map/tashkent.webp
    - assets/map/tashkent_water.png
    - assets/map/tashkent_roads.json
    - assets/world/uzbekistan/world_manifest.json
    - assets/world/uzbekistan/region_catalog.json
    - assets/world/uzbekistan/cities_index.json
    - assets/world/uzbekistan/regions/tashkent_city/
    - assets/world/uzbekistan/regions/tashkent_city/chunks/
    - assets/world/uzbekistan/administrative_boundaries.geojson
